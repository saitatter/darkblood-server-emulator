name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Generated message modules are current
        run: python tools/gen_messages.py --check
      - name: Progress table is current
        # main is protected, so CI cannot commit the table back: run
        # `python tools/gen_progress.py` before committing a schema change.
        run: python tools/gen_progress.py --check
      - name: Headless tests
        run: python -m unittest discover -s tests -v
